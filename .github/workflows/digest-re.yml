name: digest-re

# Scheduled digests for the Reinsurance deal bot (see poll-re.yml).
on:
  schedule:
    - cron: "0 13 * * 1"      # 09:00 ET Monday   -> weekly
    - cron: "0 13 1 * *"      # 09:00 ET 1st      -> monthly
    - cron: "0 21 * * 1-5"    # 17:00 ET weekdays -> daily
  workflow_dispatch:
    inputs:
      period:
        description: "daily | weekly | monthly"
        default: daily

permissions:
  contents: read

jobs:
  digest:
    if: vars.RE_BOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state-re
          key: twenty-bot-re-state-digest-${{ github.run_id }}
          restore-keys: twenty-bot-re-state-v1-

      - name: Pick period
        id: p
        run: |
          case "${{ github.event.schedule }}" in
            "0 13 * * 1")   echo "period=weekly"  >> $GITHUB_OUTPUT ;;
            "0 13 1 * *")   echo "period=monthly" >> $GITHUB_OUTPUT ;;
            "0 21 * * 1-5") echo "period=daily"   >> $GITHUB_OUTPUT ;;
            *) echo "period=${{ github.event.inputs.period || 'daily' }}" >> $GITHUB_OUTPUT ;;
          esac

      - name: Post digest
        env:
          BOT_CONFIG: config.re.json
          BOT_STATE_DIR: state-re
          BOT_LOG_DIR: logs-re
          TWENTY_TOKEN: ${{ secrets.TWENTY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_RE }}
          TELEGRAM_CHAT_ID: "5680104831,-1004435246978"
          TELEGRAM_HOME: ${{ vars.TELEGRAM_HOME_RE }}
        run: python3 bot.py report ${{ steps.p.outputs.period }}
