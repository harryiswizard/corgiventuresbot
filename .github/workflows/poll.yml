name: poll

# The bot, always on. One run polls Twenty every `poll_seconds` and answers
# Telegram commands for ~5h45m (GitHub's job cap is 6h), saves state, then
# dispatches its own successor. watchdog.yml restarts the chain if it breaks.
# Only one run may hold Telegram's getUpdates at a time, so a new run cancels
# the old one; state is on disk after every poll, and the save step runs even
# on cancel. Public repo, so the minutes are free.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["*.py", "config.json", ".github/workflows/poll.yml"]

concurrency:
  group: twenty-bot-poll
  cancel-in-progress: true

permissions:
  contents: read
  actions: write          # to dispatch the next run

jobs:
  poll:
    # Off while the E&S bot runs on Harry's Mac off the new Twenty key (2026-10-07).
    # To move it back: add secret TWENTY_TOKEN_LONDON + variable ES_BOT_ON_GITHUB=true.
    if: vars.ES_BOT_ON_GITHUB == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # State lives in the Actions cache, never in the repo: it holds deal
      # names. The cache is not publicly downloadable, and a key per run with a
      # prefix restore-key gives us "load the newest, then write a fresh one".
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: twenty-bot-state-v2-${{ github.run_id }}
          restore-keys: twenty-bot-state-v2-

      # One-off handoff from the Mac: an encrypted copy of its state, used
      # only when the cache has nothing newer. Removed once the cache is warm.
      - name: Import handoff state
        if: hashFiles('state/state.json') == '' && hashFiles('handoff.enc') != ''
        env:
          TWENTY_TOKEN: ${{ secrets.TWENTY_TOKEN }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:TWENTY_TOKEN \
            -in handoff.enc | tar xz && echo "imported Mac state" || echo "handoff not usable; seeding fresh"

      - name: Run the bot
        env:
          TWENTY_TOKEN: ${{ secrets.TWENTY_TOKEN_LONDON }}
          # New Twenty, Corgi Ventures London team only (2026-10-07).
          TWENTY_BASE: "https://corgi-ventures.crm.corgiinsure.com"
          TWENTY_TEAM_ID: "7f2f3692-04aa-4eec-8d16-7cce0ff6cbf2"
          TWENTY_OPP_OBJECT_ID: "032a6849-022d-444d-b130-5cf67096cd6d"
          APP_BASE_URL: "https://corgi-ventures.crm.corgiinsure.com"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Owner DM first, then the group; pings go to the pinned topic.
          TELEGRAM_CHAT_ID: "5680104831,-1004435246978"
          TELEGRAM_HOME: "-1004435246978:7040"
          RUN_SECONDS: "20700"
        run: python3 bot.py loop

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: twenty-bot-state-v2-${{ github.run_id }}

      # Last on purpose: the successor cancels whatever is still running.
      - name: Start the next run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run poll.yml --repo ${{ github.repository }} --ref main
