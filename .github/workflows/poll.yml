name: poll

# GitHub cannot schedule more often than every 5 minutes, so instead of one
# poll per tick, each run *stays alive* for the whole gap and polls every
# `poll_seconds` (15s) throughout. Delay is the poll interval, not the cron.
# Public repo, so the minutes are free.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Never let two runs write state at once.
concurrency:
  group: twenty-bot-poll
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # State lives in the Actions cache, never in the repo: it holds deal
      # names. The cache is not publicly downloadable, and a key per run with a
      # prefix restore-key gives us "load the newest, then write a fresh one".
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: twenty-bot-state-${{ github.run_id }}
          restore-keys: twenty-bot-state-

      - name: Poll Twenty and answer commands
        env:
          TWENTY_TOKEN: ${{ secrets.TWENTY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Just under the 5-minute cron, leaving room for checkout and setup
          # so two runs never overlap.
          RUN_SECONDS: "250"
        run: python3 bot.py loop

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: twenty-bot-state-${{ github.run_id }}
