name: digest

# Scheduled digests. Cron times are UTC; the report itself renders in the
# timezone set in config.json (America/New_York).
on:
  schedule:
    - cron: "0 13 * * 1"      # 09:00 ET Monday   -> weekly
    - cron: "0 13 1 * *"      # 09:00 ET 1st      -> monthly
  workflow_dispatch:
    inputs:
      period:
        description: "daily | weekly | monthly"
        default: daily

permissions:
  contents: read

jobs:
  digest:
    # Off while the E&S bot runs on Harry's Mac off the new Twenty key (2026-10-07).
    # To move it back: add secret TWENTY_TOKEN_LONDON + variable ES_BOT_ON_GITHUB=true.
    if: vars.ES_BOT_ON_GITHUB == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Read-only: the digest reads the event history the poller wrote.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: twenty-bot-state-digest-${{ github.run_id }}
          restore-keys: twenty-bot-state-v2-

      - name: Pick period
        id: p
        run: |
          case "${{ github.event.schedule }}" in
            "0 13 * * 1")   echo "period=weekly"  >> $GITHUB_OUTPUT ;;
            "0 13 1 * *")   echo "period=monthly" >> $GITHUB_OUTPUT ;;
            *) echo "period=${{ github.event.inputs.period || 'daily' }}" >> $GITHUB_OUTPUT ;;
          esac

      - name: Post digest
        env:
          TWENTY_TOKEN: ${{ secrets.TWENTY_TOKEN_LONDON }}
          # New Twenty, Corgi Ventures London team only (2026-10-07).
          TWENTY_BASE: "https://corgi-ventures.crm.corgiinsure.com"
          TWENTY_TEAM_ID: "7f2f3692-04aa-4eec-8d16-7cce0ff6cbf2"
          TWENTY_OPP_OBJECT_ID: "032a6849-022d-444d-b130-5cf67096cd6d"
          APP_BASE_URL: "https://corgi-ventures.crm.corgiinsure.com"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "5680104831,-1004435246978"
          TELEGRAM_HOME: "-1004435246978:7040"
        run: python3 bot.py report ${{ steps.p.outputs.period }}
